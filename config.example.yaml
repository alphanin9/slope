http:
  addr: "127.0.0.1:8080"

storage_dir: "storage"
database_path: "storage/slope.db"

backend:
  type: "libvirt"
  dsn: "qemu:///system"

limits:
  max_timeout_sec: 300
  max_sample_size: 104857600

screenshots:
  interval_sec: 5
  dedupe: true

scheduler_poll_ms: 1000
guest_poll_ms: 1000
vm_ready_timeout_ms: 120000
guest_ready_timeout_ms: 10000

machines:
  - name: "win-ctf-01"
    platform: "windows"
    snapshot: "clean"
    # Optional. If omitted, the service tries libvirt lease, QEMU guest agent,
    # then ARP address discovery and uses guest_port.
    guest_endpoint: ""
    guest_port: 9000
