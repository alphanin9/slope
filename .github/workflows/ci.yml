name: ci

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run portable tests
        run: go test ./...

  guest-agent:
    name: build guest agent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Windows GUI agent
        run: |
          mkdir -p dist/slope-guest-agent
          GOOS=windows GOARCH=amd64 go build \
            -trimpath \
            -ldflags="-s -w -H windowsgui" \
            -o dist/slope-guest-agent/slope-guest-agent.exe \
            ./cmd/slope-guest-agent

      - name: Add example config
        run: cp slope.conf.example dist/slope-guest-agent/slope.conf

      - name: Package agent
        run: |
          cd dist
          zip -9 -r slope-guest-agent-windows-amd64.zip slope-guest-agent

      - name: Upload agent artifact
        uses: actions/upload-artifact@v4
        with:
          name: slope-guest-agent-windows-amd64
          path: dist/slope-guest-agent-windows-amd64.zip
          if-no-files-found: error

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/slope-guest-agent-windows-amd64.zip
          fail_on_unmatched_files: true
